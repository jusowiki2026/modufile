<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>웹하드순위 가이드 - 2026년 실시간 P2P 및 노제휴 사이트 추천</title>
</head>
<body>
   

    <script>
        // 1. 현재 URL의 쿼리 스트링(GET 파라미터) 가져오기
        const urlParams = new URLSearchParams(window.location.search);

        // 2. 파라미터 읽기 (예: ?site=naver 또는 ?target=naver 등 원하는 이름으로 지정 가능)
        // 여기서는 'site'라는 이름의 파라미터를 확인한다고 가정합니다.
        const siteValue = urlParams.get('site');

        // 3. 조건문: site 파라미터 값이 'naver'라면 네이버로 이동
        if (siteValue === 'todisk') {
            // 네이버로 이동
            window.location.href = 'http://www.todisk.com/partner/?pid=me777&mode=R';
        }
		else if (siteValue === 'filemong') {
            // 네이버로 이동
            window.location.href = 'https://filemong.com/?pid=me666&type=j';
        }
			else if (siteValue === 'fileis') {
            // 네이버로 이동
            window.location.href = 'http://fileis.com/?p_id=me666&path=join';
        }
			else if (siteValue === 'geniefile') {
            // 네이버로 이동
            window.location.href = 'https://geniefile.com/?pid=me666&type=j';
        }
			else if (siteValue === 'filebogo') {
            // 네이버로 이동
            window.location.href = 'https://www.filebogo.com/partner/?p_id=me666&path=join';
        }
			else if (siteValue === 'smartfile') {
            // 네이버로 이동
            window.location.href = 'http://smartfile.co.kr/?p_id=me666';
        }
			else if (siteValue === 'yesfile') {
            // 네이버로 이동
            window.location.href = 'http://www.yesfile.com/partner/link.php?pid=me666&join=1';
        }
			else if (siteValue === 'filestar') {
            // 네이버로 이동
            window.location.href = 'https://filestar.co.kr/?p_code=me777';
        }
				else if (siteValue === 'ggulfile') {
            // 네이버로 이동
            window.location.href = 'https://ggulfile.com/?p_id=me666';
        }
						else if (siteValue === 'bamfile') {
            // 네이버로 이동
            window.location.href = 'https://www.bamfile.co.kr/?pid=Me666';
        }

		else {
            // 네이버가 아닐 경우의 처리 (원하는 대로 수정 가능)
            window.location.href = 'http://www.todisk.com/partner/?pid=me777&mode=R';
        }
    </script>
</body>
</html>
